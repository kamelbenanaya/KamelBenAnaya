<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Aslema, I'm Kamel — Senior Frontend Developer, React and Next.js, Sousse, Tunisia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.6" stop-color="#1A1030"/>
      <stop offset="1" stop-color="#4A0B16"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E70013"/>
      <stop offset="1" stop-color="#FF4D5E"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="280" rx="18"/></clipPath>
    <style>
      .t  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m  { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .w1 { animation: drift 14s linear infinite; }
      .w2 { animation: drift 9s linear infinite reverse; }
      .flag { animation: float 4s ease-in-out infinite; transform-origin: 1035px 105px; }
      .tw { animation: twinkle 3s ease-in-out infinite; }
      .tw2 { animation: twinkle 3s ease-in-out 1.5s infinite; }
      .fade { animation: fadein 1.4s ease-out both; }
      .fade2 { animation: fadein 1.4s ease-out .4s both; }
      .fade3 { animation: fadein 1.4s ease-out .8s both; }
      @keyframes drift  { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
      @keyframes float  { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
      @keyframes twinkle{ 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>

    <!-- stars over the Mediterranean night -->
    <g fill="#FFFFFF">
      <circle class="tw"  cx="120" cy="40"  r="1.6"/>
      <circle class="tw2" cx="260" cy="70"  r="1.2"/>
      <circle class="tw"  cx="610" cy="30"  r="1.4"/>
      <circle class="tw2" cx="780" cy="60"  r="1.1"/>
      <circle class="tw"  cx="890" cy="25"  r="1.5"/>
      <circle class="tw2" cx="1150" cy="40" r="1.3"/>
      <circle class="tw"  cx="450" cy="55"  r="1.0"/>
    </g>

    <!-- Sidi Bou Said-style arch outline -->
    <path d="M1110 280 V150 a75 75 0 0 0 -150 0 V280" fill="none" stroke="#2F6FD6" stroke-opacity=".35" stroke-width="3"/>

    <!-- Tunisian flag, drawn by hand -->
    <g class="flag">
      <rect x="990" y="75" width="90" height="60" rx="4" fill="#E70013"/>
      <circle cx="1035" cy="105" r="15" fill="#FFFFFF"/>
      <circle cx="1035" cy="105" r="11.2" fill="#E70013"/>
      <circle cx="1038.2" cy="105" r="9" fill="#FFFFFF"/>
      <polygon transform="translate(1037.6 105)" fill="#E70013"
        points="0,-6 1.41,-1.94 5.71,-1.85 2.28,0.74 3.53,4.85 0,2.4 -3.53,4.85 -2.28,0.74 -5.71,-1.85 -1.41,-1.94"/>
    </g>

    <!-- text -->
    <text class="t fade" x="72" y="88" font-size="26" fill="url(#red)" font-weight="700">عسلامة</text>
    <text class="t fade2" x="70" y="140" font-size="52" font-weight="800" fill="#FFFFFF">Aslema, I'm <tspan fill="url(#red)">Kamel</tspan></text>
    <text class="m fade3" x="72" y="180" font-size="19" fill="#C9D1D9">Senior Frontend · React &amp; Next.js · AI-Integrated Fullstack</text>
    <text class="m fade3" x="72" y="208" font-size="15" fill="#8B949E">📍 Sousse, Tunisia — where the Med meets the medina</text>

    <!-- waves -->
    <g class="w1">
      <path fill="#E70013" fill-opacity=".55"
        d="M0 250 Q150 225 300 250 T600 250 T900 250 T1200 250 T1500 250 T1800 250 T2100 250 T2400 250 V280 H0 Z"/>
    </g>
    <g class="w2">
      <path fill="#2F6FD6" fill-opacity=".45"
        d="M0 262 Q100 245 200 262 T400 262 T600 262 T800 262 T1000 262 T1200 262 T1400 262 T1600 262 T1800 262 T2000 262 T2200 262 T2400 262 V280 H0 Z"/>
    </g>
  </g>
</svg>
